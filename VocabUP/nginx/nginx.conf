events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # DEMO ONLY: $request includes query parameters such as GET login credentials.
  log_format vocabup_access '$remote_addr [$time_local] "$request" $status $body_bytes_sent';
  # The host bind mount replaces the image's /dev/stdout symlink with a regular file.
  access_log /var/log/nginx/access.log vocabup_access;

  server {
    listen 80;
    server_name localhost;

    # DEMO ONLY: intentionally expose access logs to demonstrate Information Disclosure.
    location /logs/ {
      alias /var/log/nginx/;
      autoindex on;
      access_log off;
    }

    location /api/ {
      proxy_pass http://host.docker.internal:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://host.docker.internal:5173;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
