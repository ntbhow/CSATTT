services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vocabup
      MYSQL_USER: vocabup
      MYSQL_PASSWORD: vocabup
    ports:
      - "3307:3306"
    volumes:
      - vocabup_mysql:/var/lib/mysql
      - ./backend/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  vocabup_mysql:
